[package]
name = "omawarden"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust helper and daemon for Omarchy Bitwarden Plugin"
authors = ["icyleaf"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
which = "7.0"
zeroize = { version = "1.8", features = ["derive"] }
chrono = "0.4"
url = "2.5"
totp-rs = { version = "5.6", features = ["otpauth"] }
base32 = "0.5"
hmac = "0.12"
sha1 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
