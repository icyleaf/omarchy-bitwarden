name: CI

on:
  push:
    branches:
      - main
      - develop
      - feat/*
      - fix/*
      - sec/*
      - chore/*
      - ci/*
      - refactor/*
    paths:
      - "*.qml"
      - "components/**"
      - "omawarden/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "*.qml"
      - "components/**"
      - "omawarden/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omawarden
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: omawarden -> target

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets

  frontend:
    name: Frontend Lint & Workflow Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml
          QMLLINT_BIN=$(find /usr -name qmllint -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$QMLLINT_BIN" ]; then
            sudo ln -sf "$QMLLINT_BIN" /usr/local/bin/qmllint
          fi

      - name: Run QML lint
        run: |
          qmllint --version
          qmllint OmarchyBitwarden.qml components/*.qml > qmllint_output.log 2>&1 || true
          cat qmllint_output.log
          if grep -i -E "(\bError:|\berror:|\bfatal:)" qmllint_output.log; then
            echo "::error::qmllint detected syntax or parser errors!"
            exit 1
          fi
          echo "QML lint check passed with zero syntax errors."

      - name: Run workflow action pinning check
        run: python3 tests/test_workflow_action_pinning.py
