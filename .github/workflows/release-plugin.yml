name: Release Omarchy Plugin

on:
  push:
    tags:
      - "omarchy-bitwarden-*"
      - "omarchy-bitwarden-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-plugin:
    name: Package & Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Package Plugin Archive
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="omarchy-bitwarden-${TAG_NAME}"
          mkdir -p dist

          tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" \
            OmarchyBitwarden.qml \
            components \
            scripts \
            manifest.json \
            preview.png \
            LICENSE \
            README.md \
            README.zh-CN.md
          cd dist
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cd ..

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag || github.ref_name }} --exclude-path "omawarden/**" --strip header --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Plugin Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
