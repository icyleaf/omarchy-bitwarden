name: Release Omarchy Plugin

on:
  push:
    tags:
      - 'omarchy-plugin-*'
      - 'plugin-*'
      - 'v*'

permissions:
  contents: write

jobs:
  package-plugin:
    name: Package & Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Plugin Archive
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="omarchy-bitwarden-plugin-${TAG_NAME}"
          mkdir -p dist

          tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" \
            OmarchyBitwarden.qml \
            components \
            manifest.json \
            config.json \
            preview.png \
            LICENSE \
            README.md \
            docs

          cd dist
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cd ..

      - name: Create Plugin Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omarchy Bitwarden Plugin ${{ github.ref_name }}"
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
