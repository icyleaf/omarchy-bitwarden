name: Release Omawarden CLI (AUR Git)

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/release-aur-git.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-aur-git:
    name: Publish omawarden-git to AUR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate PKGBUILD
        run: |
          mkdir -p dist/aur-git
          cat << 'EOF' > dist/aur-git/PKGBUILD
          # Maintainer: icyleaf <icyleaf.cn at gmail dot com>

          pkgname=omawarden-git
          pkgver=0.8.0.r0.g0000000
          pkgrel=1
          pkgdesc="High-performance Bitwarden CLI and resident daemon (VCS build from develop branch)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=('libsecret' 'wl-clipboard')
          makedepends=('cargo' 'git')
          optdepends=('libfido2: WebAuthn / Passkey / FIDO2 security key support')
          provides=('omawarden' 'omawarden-bin')
          conflicts=('omawarden' 'omawarden-bin')
          options=('!lto')
          source=("omarchy-bitwarden::git+https://github.com/${{ github.repository }}.git#branch=develop")
          sha256sums=('SKIP')

          pkgver() {
              cd "${srcdir}/omarchy-bitwarden"
              _ver=$(grep '^version = ' omawarden/Cargo.toml | head -n 1 | cut -d'"' -f2 | cut -d'-' -f1)
              _rev=$(git rev-list --count HEAD)
              _hash=$(git rev-parse --short=7 HEAD)
              printf "%s.r%s.g%s" "$_ver" "$_rev" "$_hash"
          }

          build() {
              cd "${srcdir}/omarchy-bitwarden/omawarden"
              cargo build --frozen --release --bin omawarden
          }

          package() {
              cd "${srcdir}/omarchy-bitwarden"
              install -Dm755 omawarden/target/release/omawarden "${pkgdir}/usr/bin/omawarden"
              install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
          }
          EOF
          sed -i 's/^          //' dist/aur-git/PKGBUILD

      - name: Validate PKGBUILD syntax
        run: |
          bash -n dist/aur-git/PKGBUILD
          echo "PKGBUILD syntax is valid."

      - name: Publish AUR package
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@2ac5a4c1d7035885d46b10e3193393be8460b6f1 # v4.1.1
        with:
          pkgname: omawarden-git
          pkgbuild: ./dist/aur-git/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "upgpkg: omawarden-git (track develop branch)"
          ssh_keyscan_types: rsa,ecdsa,ed25519
