name: Release Omawarden CLI (Dev)

on:
  push:
    branches:
      - develop
    paths:
      - 'omawarden/**'
      - '.github/workflows/release-dev-omawarden.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-dev:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool (if needed)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          cd omawarden
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifact
        id: package
        run: |
          CARGO_VERSION=$(grep '^version = ' omawarden/Cargo.toml | head -n 1 | cut -d'"' -f2)
          ARCHIVE_NAME="omawarden-${CARGO_VERSION}-${{ matrix.target }}"
          DIST_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${DIST_DIR}"
          cp "omawarden/target/${{ matrix.target }}/release/omawarden" "${DIST_DIR}/"
          cp LICENSE README.md "${DIST_DIR}/"

          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cp "${ARCHIVE_NAME}.tar.gz" "omawarden-${{ matrix.target }}.tar.gz"
          sha256sum "omawarden-${{ matrix.target }}.tar.gz" > "omawarden-${{ matrix.target }}.tar.gz.sha256"
          cd ..

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Upload artifact to job
        uses: actions/upload-artifact@v7
        with:
          name: omawarden-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-dev:
    name: Publish Dev Pre-Release
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Update omawarden-dev tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f omawarden-dev
          git push origin omawarden-dev --force

      - name: Get Short SHA and Version
        id: meta
        run: |
          CARGO_VERSION=$(grep '^version = ' omawarden/Cargo.toml | head -n 1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          echo "version=${CARGO_VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Create or Update Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: omawarden-dev
          name: "Omawarden (dev)"
          body: |
            ## Omawarden Development Build

            - **Version**: `${{ steps.meta.outputs.version }}`
            - **Commit**: [${{ steps.meta.outputs.sha }}](https://github.com/${{ github.repository }}/commit/${{ steps.meta.outputs.sha }})
            - **Build Date**: `${{ steps.meta.outputs.date }}`
            - **Branch**: `develop`

            > [!NOTE]
            > This is an automated rolling development pre-release built from the `develop` branch.
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          draft: false
          prerelease: true
          make_latest: false
