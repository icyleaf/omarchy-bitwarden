name: Release Omawarden CLI

on:
  push:
    tags:
      - "omawarden-[0-9]*"
      - "omawarden-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool (if needed)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

      - name: Validate Cargo.toml version matches release tag
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#omawarden-}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version = ' omawarden/Cargo.toml | head -n 1 | cut -d'"' -f2)
          echo "Release tag version: ${TAG_VERSION}, Cargo.toml version: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Release tag version (${TAG_VERSION}) does not match omawarden/Cargo.toml version (${CARGO_VERSION})!"
            exit 1
          fi

      - name: Build release binary
        run: |
          cd omawarden
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifact
        id: package
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#omawarden-}"
          ARCHIVE_NAME="omawarden-${VERSION}-${{ matrix.target }}"
          DIST_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${DIST_DIR}"
          cp "omawarden/target/${{ matrix.target }}/release/omawarden" "${DIST_DIR}/"
          cp LICENSE README.md "${DIST_DIR}/"

          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cp "${ARCHIVE_NAME}.tar.gz" "omawarden-${{ matrix.target }}.tar.gz"
          sha256sum "omawarden-${{ matrix.target }}.tar.gz" > "omawarden-${{ matrix.target }}.tar.gz.sha256"
          cd ..

          echo "archive_path=dist/${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          echo "sha256_path=dist/${ARCHIVE_NAME}.tar.gz.sha256" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Upload artifact to job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omawarden-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish Omawarden Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@4a4a951bc43fafe41cd2348d181853f52356bee7 # v4.4.2
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag || github.ref_name }} --tag-pattern "^omawarden-v?[0-9].*" --include-path "omawarden/**" --strip header --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          draft: false
          prerelease: false
          make_latest: true

  publish-aur:
    name: Publish to AUR
    needs: [build-release, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate PKGBUILD
        id: pkgbuild
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          RAW_TAG="${RAW_TAG#refs/tags/}"
          VERSION="${RAW_TAG#omawarden-}"
          PKGVER="${VERSION#v}"

          echo "Resolving SHA256 checksums from build artifacts..."
          TAR_X86=$(find artifacts -name "*x86_64*.tar.gz" -not -name "omawarden-x86_64-unknown-linux-gnu.tar.gz" | head -n 1)
          if [ -z "$TAR_X86" ]; then
            TAR_X86=$(find artifacts -name "*x86_64*.tar.gz" | head -n 1)
          fi
          TAR_AARCH64=$(find artifacts -name "*aarch64*.tar.gz" -not -name "omawarden-aarch64-unknown-linux-gnu.tar.gz" | head -n 1)
          if [ -z "$TAR_AARCH64" ]; then
            TAR_AARCH64=$(find artifacts -name "*aarch64*.tar.gz" | head -n 1)
          fi

          SHA_X86=$(sha256sum "$TAR_X86" | awk '{print $1}')
          SHA_AARCH64=$(sha256sum "$TAR_AARCH64" | awk '{print $1}')

          echo "Version: ${PKGVER} (Tag: ${RAW_TAG})"
          echo "SHA256 x86_64: ${SHA_X86}"
          echo "SHA256 aarch64: ${SHA_AARCH64}"

          mkdir -p dist/aur
          sed -e 's/^          //' << EOF > dist/aur/PKGBUILD
          # Maintainer: icyleaf <icyleaf.cn at gmail dot com>

          pkgname=omawarden-bin
          pkgver=${PKGVER}
          pkgrel=1
          pkgdesc="High-performance Bitwarden CLI and resident daemon (Designed for Omarchy)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=('libsecret' 'wl-clipboard')
          optdepends=('libfido2: WebAuthn / Passkey / FIDO2 security key support')
          provides=('omawarden')
          conflicts=('omawarden')
          source_x86_64=("\${pkgname}-\${pkgver}-x86_64.tar.gz::https://github.com/${{ github.repository }}/releases/download/${RAW_TAG}/omawarden-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('${SHA_X86}')
          source_aarch64=("\${pkgname}-\${pkgver}-aarch64.tar.gz::https://github.com/${{ github.repository }}/releases/download/${RAW_TAG}/omawarden-${VERSION}-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_aarch64=('${SHA_AARCH64}')

          package() {
              install -Dm755 "\${srcdir}"/omawarden-*/omawarden "\${pkgdir}/usr/bin/omawarden"
              install -Dm644 "\${srcdir}"/omawarden-*/LICENSE "\${pkgdir}/usr/share/licenses/\${pkgname}/LICENSE"
          }
          EOF

          echo "Generated PKGBUILD:"
          cat dist/aur/PKGBUILD
          echo "pkgver=${PKGVER}" >> $GITHUB_OUTPUT

      - name: Publish AUR package
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@2ac5a4c1d7035885d46b10e3193393be8460b6f1 # v4.1.1
        with:
          pkgname: omawarden-bin
          pkgbuild: ./dist/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "upgpkg: omawarden-bin ${{ steps.pkgbuild.outputs.pkgver }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

